version: 2
updates:
  - package-ecosystem: 'npm'
    # One pnpm workspace. The root lockfile covers every package.
    directories: ['/', '/apps/*', '/packages/*']
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        update-types: ['minor', 'patch']
    ignore:
      # @astrojs/check and @typescript-eslint do not support TypeScript 7 yet. Remove this rule when they do.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      # The project runs Node 24. Keep @types/node on 24.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
